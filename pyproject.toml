[project]
name = "fsaudit"
version = "0.1.0"
description = "Outil d'audit de fichiers en ligne de commande"
requires-python = ">=3.13"
dependencies = ["typer>=0.28.0"]

[project.scripts]
fsaudit = "fsaudit.cli:app"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=2.4.1", "pytest>=9.2.0", "ruff"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 88
